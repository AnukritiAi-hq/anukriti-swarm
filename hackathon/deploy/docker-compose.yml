# Anukriti PGx — docker-compose for the hackathon submission.
#
# Usage (on the EC2 box):
#     docker compose -f hackathon/deploy/docker-compose.yml up -d --build
#
# Binds 127.0.0.1:9000 only — nginx fronts it and terminates TLS.

services:
  anukriti-pgx:
    build:
      context: ../..                              # project root
      dockerfile: hackathon/deploy/Dockerfile
    image: anukriti-pgx:hackathon
    container_name: anukriti-pgx
    restart: unless-stopped
    # Expose only on localhost — nginx is the public face.
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      # Project-root .env carries optional LLM API keys. The MCP
      # server runs purely deterministic if these are absent.
      - ../../.env
    environment:
      ANUKRITI_MCP_HOST: 0.0.0.0
      ANUKRITI_MCP_PORT: 9000
      PYTHONUNBUFFERED: "1"
    healthcheck:
      test:
        - "CMD-SHELL"
        - |
          curl -fsS -H "Accept: application/json, text/event-stream" \
            http://localhost:9000/mcp -o /dev/null -w "%{http_code}" \
            | grep -qE "^(200|400|406)$" || exit 1
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 20s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
