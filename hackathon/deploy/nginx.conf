# Anukriti PGx — nginx reverse proxy config
#
# Copy to /etc/nginx/conf.d/anukriti-pgx.conf and edit the server_name.
# certbot will rewrite this on first run to add TLS + HTTP->HTTPS
# redirect.

server {
    listen 80;
    server_name anukriti-pgx.example.com;  # EDIT ME

    # Let certbot's HTTP challenge through.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # MCP endpoint — proxy to the Docker container on localhost:9000.
    # FastMCP uses HTTP streaming so we keep the connection open.
    location /mcp {
        proxy_pass http://127.0.0.1:9000/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pass SHARP headers through untouched so the FastMCP
        # ``get_http_headers`` dependency can read them. These are
        # the exact names Prompt Opinion emits.
        proxy_pass_header x-fhir-server-url;
        proxy_pass_header x-fhir-access-token;
        proxy_pass_header x-patient-id;
        proxy_pass_header x-session-id;
        proxy_pass_header x-fhir-issuer;

        # Long-lived SSE / streaming MCP requests — don't buffer.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;

        # Disable gzip for SSE so chunks flush immediately.
        gzip off;
    }

    # Root path — short identification response. Useful for health
    # checks and for confirming the deploy is live before
    # hooking up the MCP client.
    location = / {
        add_header Content-Type text/plain;
        return 200 "Anukriti PGx MCP Superpower — see /mcp for the MCP endpoint.\n";
    }

    # Reject everything else — we don't serve anything other than /mcp.
    location / {
        return 404;
    }
}
