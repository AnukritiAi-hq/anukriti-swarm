[project]
name = "anukriti-swarm"
version = "0.1.0"
description = "Distributed multi-agent genomic intelligence for population-aware pharmacogenomic reasoning"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
